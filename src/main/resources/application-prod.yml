server:
  port: 8080

spring:
  config:
    activate:
      on-profile: prod
  redis:
    host: redis-service
    port: 6379
  rabbitmq:
    host: rabbitmq-service
    port: 5672
    username: guest
    password: guest
    virtual-host: /
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST}:3306/smartfridge?serverTimezone=Asia/Seoul
    username: admin
    password: ${DB_PW}
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show_sql: true

  # Email
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_EMAIL}
    password: ${SMTP_PW}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      auth-code-expiration-millis: 1800000
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1000MB
app:
  admin:
    name: ${ADMIN_NAME}
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
cloud:
  aws:
    credentials:
      access-key: ${AWS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ap-northeast-2
    s3:
      bucket: ${BUCKET}

jwt:
  expirationAt: 1000
  secretKeyAt: ${AT_KEY}
  expirationRt: 10000
  secretKeyRt: ${RT_KEY}

oauth:
  google:
    client-id: ${GOOGLE_ID}
    client-secret: ${GOOGLE_PW}
    redirect-uri: https://www.smartfridge.cloud/oauth/google/redirect
  kakao:
    client-id: ${KAKAO_ID}
    redirect-uri: https://www.smartfridge.cloud/oauth/kakao/redirect
  naver:
    client-id: ${NAVER_ID}
    client-secret: ${NAVER_PW}
    redirect-uri: https://www.smartfridge.cloud/oauth/naver/redirect